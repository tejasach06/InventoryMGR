services:
  db-test:
    image: docker.io/library/postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: inventorymgr
      POSTGRES_DB: inventorymgr_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventorymgr -d inventorymgr_test"]
      interval: 3s
      timeout: 5s
      retries: 20
[project]
name = "inventorymgr-api"
version = "0.1.0"
description = "InventoryMGR FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.161.1",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy==2.1.6",
  "alembic==1.19.2",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "PyJWT==2.15.1",
  "pwdlib[argon2]==0.3.1",
  "python-multipart==0.0.32",
  "email-validator==2.2.0",
  "slowapi==0.1.10",
  "xlsxwriter==3.2.9",
  "ldap3==2.9.1",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "httpx==0.28.1",
  "ruff==0.16.10",
  "mypy==2.3.1",
]

[tool.uv]
package = false
required-version = ">=0.12.18"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904", "E712"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
plugins = []
ignore_missing_imports = true
strict = false

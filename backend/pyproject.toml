[project]
name = "inventorymgr-api"
version = "0.1.0"
description = "InventoryMGR FastAPI backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.142.1",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy==2.1.2",
  "alembic==1.19.2",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.14.2",
  "PyJWT==2.15.0",
  "pwdlib[argon2]==0.3.0",
  "python-multipart==0.0.31",
  "email-validator==2.2.0",
  "slowapi==0.1.9",
  "xlsxwriter==3.2.8",
  "ldap3==2.9",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.0",
  "pytest-asyncio==1.3.0",
  "httpx==0.28.0",
  "ruff==0.16.9",
  "mypy==2.3.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904", "E712"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
plugins = []
ignore_missing_imports = true
strict = false

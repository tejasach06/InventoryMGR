[package]
name = "inventorymgr-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[dependencies]
axum = { version = "~0.8.9", features = ["macros", "multipart"] }
tokio = { version = "~1.54.1", features = ["full"] }
tokio-util = { version = "~0.7.20", features = ["io"] }
tower = { version = "~0.5.3", features = ["util"] }
tower-http = { version = "~0.6.11", features = ["cors", "trace", "compression-gzip", "set-header"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.154"
sqlx = { version = "~0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "derive", "chrono", "uuid", "json"] }
chrono = { version = "~0.4.45", features = ["serde"] }
uuid = { version = "~1.28.0", features = ["serde", "v4"] }
jsonwebtoken = "~9.3.1"
argon2 = "~0.5.3"
rand_core = { version = "~0.6.4", features = ["getrandom"] }
sha2 = "~0.10.9"
hmac = "~0.12.1"
hex = "~0.4.3"
dotenvy = "~0.15.7"
tracing = "~0.1.44"
tracing-subscriber = { version = "~0.3.23", features = ["env-filter"] }
thiserror = "~2.0.21"
rust_xlsxwriter = "~0.100.0"
csv = "~1.4.0"
reqwest = { version = "~0.12.28", default-features = false, features = ["rustls-tls", "json"] }
ldap3 = { version = "~0.12.1", default-features = false, features = ["tls-rustls-ring"] }
fernet = { version = "~0.2.2", default-features = false, features = ["rustcrypto"] }
base64 = "~0.22.1"
regex = "~1.13.1"
parking_lot = "~0.12.5"

[dev-dependencies]
tower = { version = "~0.5.3", features = ["util"] }
http-body-util = "~0.1.5"
zip = { version = "~9.0.5", default-features = false, features = ["deflate"] }

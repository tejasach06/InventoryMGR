[package]
name = "inventorymgr-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.1", features = ["macros", "multipart"] }
tokio = { version = "1.43.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.2", features = ["cors", "trace", "compression-gzip", "set-header"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "derive", "chrono", "uuid", "json"] }
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.12.1", features = ["serde", "v4"] }
jsonwebtoken = "9.3.0"
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.10.8"
hmac = "0.12.1"
hex = "0.4.3"
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
thiserror = "2.0.11"
rust_xlsxwriter = "0.80.0"
csv = "1.3.1"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "json"] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
base64 = "0.22.1"
regex = "1.11.1"
parking_lot = "0.12.3"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[package]
name = "inventorymgr-parity"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "parity"
path = "src/main.rs"

[[bin]]
name = "pg-bridge"
path = "src/bin/pg_bridge.rs"

[dependencies]
reqwest = { version = "~0.12.28", default-features = false, features = ["blocking", "json", "cookies"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.154"
regex = "~1.13.1"
uuid = { version = "~1.28.0", features = ["v4"] }
url = "~2.5.8"
zip = { version = "~9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
sha2 = "~0.10.9"
hmac = "~0.12.1"
base64 = "~0.22.1"
